# Preserve maintenance connectivity and manual screen state during upgrades.
# Load updated libraries on the next normal reboot.
$nrconf{override_rc}{qr(^chiron-usb(?:\.service)?$)} = 0;
$nrconf{override_rc}{qr(^chiron-power-button(?:\.service)?$)} = 0;
# Wi-Fi is enabled by the one-shot MSS preparation sequence. Do not disrupt
# association or re-evaluate the initial unmanaged policy mid-upgrade.
$nrconf{override_rc}{qr(^NetworkManager(?:\.service)?$)} = 0;
$nrconf{override_rc}{qr(^wpa_supplicant(?:\.service)?$)} = 0;
