xwayland disable
output * scale 1.666667
output * bg #17212b solid_color
input type:touch events enabled
seat * hide_cursor 3000
font pango:DejaVu Sans 12
default_border pixel 1
default_floating_border pixel 1
focus_follows_mouse no
exec env XDG_CONFIG_HOME=/etc/chiron/keyboard-ui SQUEEKBOARD_KEYBOARDSDIR=/etc/chiron/keyboards squeekboard
exec "/usr/local/libexec/chiron-gtkgreet -l -s /etc/chiron/greeter-terminal.css; swaymsg exit"
bar {
    position top
    height 46
    font pango:DejaVu Sans 12
    tray_output none
    workspace_buttons no
    status_command /usr/local/libexec/chiron-wayland-status --info
    colors {
        background #17212b
        statusline #ffffff
        separator #435766
    }
}

bar {
    id system-controls
    swaybar_command /usr/local/libexec/chiron-controls-bar
    position top
    height 46
    font pango:DejaVu Sans 12
    tray_output none
    workspace_buttons no
    status_command /usr/local/libexec/chiron-wayland-status --buttons --greeter
    colors {
        background #17212b
        statusline #ffffff
        separator #435766
    }
}
